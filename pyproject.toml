[project]
name = "javascript"
version = "1!1.2.6"
description = "Call and interop Node.js APIs with Python"
authors = [
    {name = "extremeheat", email = "extreme@protonmail.ch"},
]
dependencies = [
    "loguru>=0.7.2",
]
requires-python = ">=3.10, <4"
readme = "README.md"
license = {text = "MIT"}
keywords = ["node", "javascript", "bridge", "development"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Topic :: Software Development :: Build Tools",
]


[project.urls]
Homepage = "https://github.com/extremeheat/JSPyBridge"
"Bug Reports" = "https://github.com/extremeheat/JSPyBridge/issues"
"Say Thanks!" = "https://github.com/extremeheat/JSPyBridge"
Source = "https://github.com/extremeheat/JSPyBridge/"

[dependency-groups]
dev = [
    "check-manifest",
    "ruff>=0.15.11",
]
test = [
    "coverage",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.pdm.build]
includes = ["src/javascript"]

[tool.pdm.scripts]
format = { composite = ["ruff format .", "ruff check . --fix"] }

[tool.ruff]
line-length = 120
target-version = "py310"
#include = ["src/javascript/**/*.py"]
respect-gitignore = true

[tool.ruff.lint]
select = ["E", "W", "F", "UP", "C", "T", "PYI", "PT", "Q"]
ignore = ["C901", "T201", "E731", "E402", "PYI055"]

[tool.ruff.lint.isort]
force-sort-within-sections = false
extra-standard-library = ["typing_extensions"]